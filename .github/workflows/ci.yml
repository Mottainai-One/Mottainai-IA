name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # ============================================================
  # JOB 1: IA funciona sem erros (testes, lint e compilacao)
  # Checklist: "IA funciona sem erros"
  # ============================================================
  test:
    name: 1. IA Funciona sem Erros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app config interfaces scripts

      - name: Compile check
        run: python -m compileall -q app config interfaces tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # ============================================================
  # JOB 2: Prompts organizados e documentados
  # Checklist: "Prompts estão organizados e documentados"
  # ============================================================
  prompts-documented:
    name: 2. Prompts Documentados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar prompts organizados nos agentes
        run: |
          set -e
          echo ">>> Verificando que todos os prompts (_PROMPT) vivem em app/agents/"

          # Prompts sao strings longas em portugues; devem estar APENAS nos agentes.
          # Arquivos permitidos (onde prompts sao definidos por design):
          ALLOWED=(cliente.py dono.py faq.py funcionario.py juiz.py motor_preditivo.py visao.py governanca.py runtime.py)

          for file in $(find app agents interfaces -name "*.py" 2>/dev/null); do
            # pular arquivos que nao sao python
            [[ "$file" == *.py ]] || continue
            # ignorar permission/outros arquivos de script raiz
            case "$file" in
              app/agents/*) continue ;;  # pasta de agentes: permitida
            esac
            if grep -qE '(_PROMPT|_SYSTEM_PROMPT)\s*=' "$file"; then
              echo "ERRO: prompt definido fora de app/agents/ em: $file"
              echo "Prompts de sistema devem ficar nos arquivos de agente."
              exit 1
            fi
          done

          # Cada agente com prompt deve ter documentacao (docstring ou comentario "Note")
          for agent in "${ALLOWED[@]}"; do
            f="app/agents/$agent"
            [ -f "$f" ] || continue
            # deve definir ao menos um prompt
            if ! grep -qE '(_PROMPT|_SYSTEM_PROMPT)\s*=' "$f"; then
              continue
            fi
            # deve ter docstring ou comentario de proposito antes do prompt
            if ! grep -qE '^\s*("""|Note:|#)' "$f"; then
              echo "ERRO: $f define prompt sem docstring/comentario de proposito"
              exit 1
            fi
          done

          echo ">>> Prompts organizados e documentados OK"

  # ============================================================
  # JOB 3: Respostas da IA validadas (Juiz fail-closed + guardrail de saida)
  # Checklist: "Respostas da IA são validadas"
  # ============================================================
  responses-validated:
    name: 3. Respostas Validadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar Juiz e guardrail de saida no fluxo
        run: |
          set -e
          echo ">>> Verificando que o Juiz (fail-closed) e o guardrail de saida estao no fluxo"

          # 1) Juiz e guardrail de saida devem ser nos do grafo
          if ! grep -q 'juiz' app/agents/supervisor.py; then
            echo "ERRO: no 'juiz' nao registrado no grafo (supervisor.py)"
            exit 1
          fi
          if ! grep -q 'guardrail_saida' app/agents/supervisor.py; then
            echo "ERRO: no 'guardrail_saida' nao registrado no grafo (supervisor.py)"
            exit 1
          fi

          # 2) guardrail de saida deve ser capaz de BLOQUEAR (fail-closed / safe=False)
          if ! grep -qE 'safe\s*=\s*False' app/guardrails/saida.py; then
            echo "ERRO: guardrail de saida nao implementa bloqueio (safe=False)"
            exit 1
          fi

          # 3) O Juiz deve avaliar a resposta com grounding/escopo (medida de qualidade)
          if ! grep -qE 'grounding|escopo|confidence|score' app/agents/juiz.py; then
            echo "ERRO: Juiz nao registra metrica de qualidade da resposta (grounding/score)"
            exit 1
          fi

          # 4) Guardrail de saida deve tratar PII e vazamento interno
          if ! grep -q '_PII_' app/guardrails/saida.py; then
            echo "ERRO: guardrail de saida nao trata PII"
            exit 1
          fi

          echo ">>> Validacao de respostas OK"

      - name: Rodar testes de guardrails e Juiz
        run: |
          set -e
          python -m unittest tests.test_guardrails tests.test_judge_rag -v

  # ============================================================
  # JOB 4: Erros e timeouts tratados
  # Checklist: "Erros e timeouts são tratados"
  # ============================================================
  errors-timeouts:
    name: 4. Erros e Timeouts Tratados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar retry, backoff e timeouts nas integracoes
        run: |
          set -e
          echo ">>> Verificando tratamento de erros e timeouts"

          # 1) LLM deve ter retry com backoff (transient timeout/5xx/rate limit)
          if ! grep -qE 'with_retry|tenacity|retry' app/agents/runtime.py; then
            echo "ERRO: runtime de LLM nao implementa retry"
            exit 1
          fi

          # 2) Redis deve ter timeouts de conexao/socket explícitos
          if ! grep -qE 'socket_connect_timeout|socket_timeout' app/database/redis_client.py; then
            echo "ERRO: cliente Redis nao define timeouts"
            exit 1
          fi

          # 3) Chamadas HTTP externas (RAG fonte externa, MCP tools) devem ter timeout
          if ! grep -qE 'timeout=' app/rag/external_source.py; then
            echo "ERRO: fonte externa RAG (httpx) sem timeout"
            exit 1
          fi
          if ! grep -qE 'timeout=' app/tools/mcp_tools.py; then
            echo "ERRO: tools MCP (httpx) sem timeout"
            exit 1
          fi

          # 4) Config de retries/timeouts centralizada em config/settings.py
          if ! grep -qE 'llm_max_retries|timeout_seconds' config/settings.py; then
            echo "ERRO: config de retries/timeouts nao encontrada em config/settings.py"
            exit 1
          fi

          echo ">>> Erros e timeouts tratados OK"

  # ============================================================
  # JOB 5: Agentes com responsabilidades e ferramentas bem definidas
  # Checklist: "Agentes possuem responsabilidades e ferramentas bem definidas"
  # ============================================================
  agents-tools:
    name: 5. Agentes e Ferramentas Definidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar responsabilidades dos agentes
        run: |
          set -e
          echo ">>> Verificando que cada agente define responsabilidade (prompt) e esta no grafo"

          # Cada agente de dominio (arquivo em app/agents, exceto runtime/supervisor/__init__)
          # deve definir um prompt de proposito (SYSTEM_PROMPT/_PROMPT) descrevendo responsabilidade.
          for f in app/agents/*.py; do
            base=$(basename "$f")
            case "$base" in
              __init__.py|supervisor.py|runtime.py) continue ;;
            esac
            if ! grep -qE '(_PROMPT|_SYSTEM_PROMPT)\s*=' "$f"; then
              echo "ERRO: agente $base nao define prompt de responsabilidade"
              exit 1
            fi
            # o agente deve ter um node no grafo (node_*)
            if ! grep -q "$(basename "$f" .py)" app/agents/supervisor.py; then
              echo "ERRO: agente $base nao registrado como node no grafo (supervisor.py)"
              exit 1
            fi
          done

          # Cada node de agente no grafo deve ter prompt correspondente
          for node in cliente faq funcionario dono motor_preditivo juiz visao; do
            if grep -q 'add_node("'"$node"'"' app/agents/supervisor.py && ! ls app/agents/*.py | xargs grep -lq '"$node"' 2>/dev/null; then
              : # node pode ser remetido a um helper; nao bloqueia
            fi
          done

          echo ">>> Agentes com responsabilidades definidas OK"

      - name: Verificar ferramentas/rotas MCP
        run: |
          set -e
          echo ">>> Ferramentas de dominio presentes"
          for tool in app/tools/postgres_tools.py app/tools/redis_tools.py app/tools/vision_tools.py app/tools/mcp_tools.py; do
            [ -f "$tool" ] || { echo "ERRO: ferramenta ausente: $tool"; exit 1; }
          done
          # integracao A2A/MCP para descoberta de agentes
          grep -qE 'mcp_tools|tools' app/integrations/mcp_a2a.py || { echo "ERRO: MCP/A2A sem ferramentas"; exit 1; }
          echo ">>> Ferramentas definidas OK"

  # ============================================================
  # JOB 6: RAG retornando contexto relevante
  # Checklist: "RAG está retornando contexto relevante"
  # ============================================================
  rag-context:
    name: 6. RAG Contexto Relevante
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar pipeline RAG
        run: |
          set -e
          echo ">>> Verificando o pipeline de RAG"

          # retriever + fonte externa existem
          [ -f app/rag/retriever.py ] || { echo "ERRO: retriever RAG ausente"; exit 1; }
          [ -f app/rag/external_source.py ] || { echo "ERRO: fonte externa RAG ausente"; exit 1; }

          # RAG deve manter as fontes/contexto retornado (checklist: contexto relevante)
          if ! grep -qE 'source|fonte|document' app/rag/retriever.py; then
            echo "ERRO: retriever nao expoe as fontes/contexto"
            exit 1
          fi

          # cache de RAG (Redis) presente para sinonimos de mesmo contexto
          grep -q 'cache' app/rag/retriever.py || echo "AVISO: RAG sem cache explicito"

      - name: Rodar testes de RAG e Juiz
        run: |
          set -e
          python -m unittest tests.test_judge_rag -v

  # ============================================================
  # JOB 7: Sem credenciais expostas
  # Checklist: "Não existem credenciais expostas"
  # ============================================================
  secret-scan:
    name: 7. Sem Credenciais Expostas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact -v

      - name: Protecao do .env e credenciais
        run: |
          set -e
          echo ">>> Verificando que nao ha credenciais versionadas"

          # 1) Nenhum .env real versionado
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "ERRO: arquivo .env encontrado no repositorio"
            exit 1
          fi

          # 2) .env nunca commitado no historico
          if git log --all --oneline -- .env | grep -q .; then
            echo "ERRO: .env ja foi commitado no historico"
            exit 1
          fi

          # 3) .env no .gitignore
          if ! grep -qE '^\.env' .gitignore 2>/dev/null; then
            echo "AVISO: .env nao esta no .gitignore"
          fi

          # 4) Sem chaves/segredos hard-coded em codigo python
          if grep -rEn 'sk-[A-Za-z0-9]{10,}|AIza[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9]{20,}' --include="*.py" --include="*.env.example" . | grep -v '.env.example' | grep -q .; then
            echo "ERRO: possivel chave hard-coded encontrada no codigo"
            exit 1
          fi

          echo ">>> Nenhuma credencial exposta OK"

  # ============================================================
  # JOB 8: Alteracoes de IA documentadas na PR
  # Checklist: "Alterações de IA estão documentadas na PR"
  # ============================================================
  pr-documentation:
    name: 8. Alteracoes Documentadas na PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convencao de commits
        run: |
          set -e
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert):"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            COMMITS=$(git log --oneline -10)
          fi

          echo "Commits encontrados:"
          echo "$COMMITS"

          echo "$COMMITS" | while read -r line; do
            [ -z "$line" ] && continue
            COMMIT_MSG=$(echo "$line" | cut -d' ' -f2-)
            if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
              echo "ERRO: Commit nao segue a convencao: $COMMIT_MSG"
              echo "Padrao esperado: feat|fix|docs|style|refactor|test|chore|ci: mensagem"
              exit 1
            fi
          done

          echo "Convencao de commits OK"

      - name: Verificar documentacao das alteracoes de agentes
        run: |
          set -e
          echo ">>> Alteracoes em agentes devem estar refletidas na documentacao"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || true)
          fi

          echo "Arquivos alterados:"
          echo "$CHANGED"

          # Se houve alteracao em app/agents/ e a doc de arquitetura/readme nao foi tocada,
          # avisa (nao bloqueia) para encorajar documentacao na descricao da PR.
          if echo "$CHANGED" | grep -q 'app/agents/'; then
            if ! echo "$CHANGED" | grep -qE '(ARQUITETURA\.md|README\.md)'; then
              echo "AVISO: alteracoes em agentes sem atualizacao em ARQUITETURA.md/README.md"
              echo "Descreva a mudanca de IA na descricao da PR (checklist item 8)."
            fi
          fi

          echo "Verificacao de documentacao concluida"
