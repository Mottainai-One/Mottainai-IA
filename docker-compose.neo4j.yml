services:
  neo4j:
    image: neo4j:2026.10.1
    container_name: mottainai-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo de ambiente}
      GRAPH_PASSWORD: ${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no arquivo de ambiente}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$GRAPH_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  neo4jdata:
