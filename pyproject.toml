[project]
name = "mottainai-ia"
version = "1.0.0"
description = "Camada de IA multiagente para gestão preditiva de estoque"
requires-python = ">=3.13,<3.14"

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 (line-too-long) is ignored project-wide: most hits are long natural-language
# SYSTEM_PROMPT/JUDGE_PROMPT strings (in Portuguese, by design — see AGENTS.md) and
# long SQL statements, not code that benefits from hard-wrapping.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts insert the project root into sys.path before importing
# project modules, which ruff sees as "import not at top of file".
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["app", "config", "interfaces"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
skip_empty = true
