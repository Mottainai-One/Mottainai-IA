[project]
name = "mottainai-ia"
version = "1.0.0"
description = "Camada de IA multiagente para gestão preditiva de estoque"
requires-python = ">=3.13,<3.14"

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
